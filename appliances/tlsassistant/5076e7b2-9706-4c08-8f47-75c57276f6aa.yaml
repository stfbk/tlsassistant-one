creation_time: 1791466200
description: |-
  [TLSAssistant](https://st.fbk.eu/tools/TLSAssistant) is an open-source modular framework capable of
  identifying a wide range of TLS vulnerabilities and assessing
  compliance with multiple guidelines. Its actionable report can
  assist the user in correctly and easily fixing their configurations.

  This appliance wraps the official `stfbk/tlsassistant` Docker container,
  automating the execution of TLS scans and securely delivering the resulting
  PDF reports to any S3-compatible object storage to be easily retrieved.

  Possible use cases:
    1. A public administration from a given country wants to employ OpenNebula’s
       easy-to-configure cloud capabilities while also being compliant with the
       security requirements of its country of belonging. TLSAssistant’s internal
       dataset allows to compare the current webserver configuration against one
       or multiple (inter)national guidelines;
    2. A cloud-native service wanting to periodically check the security of its
       infrastructure.
    
  **NOTE**: this appliance is highly configurable and requires the user
  to set parameters on instantiation. Please refer to the [documentation](https://github.com/OpenNebula/marketplace-community/blob/master/appliances/tlsassistant/README.md).

  For detailed information on the analysis engine, you can head to our repository on [GitHub](https://github.com/stfbk/tlsassistant).
short_description: TLSAssistant is an opensource, modular extensive framework that combines state-of-the-art TLS analyzers with a report system that suggests appropriate mitigations and shows the full set of viable attacks.
tags:
- tlsassistant
- tls
- docker
