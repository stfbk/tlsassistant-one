---
:app:
  :name: tlsassistant
  :type: service
  :os:
    :type: linux
    :base: ubuntu2204min
  :arch: x86_64
  :format: qcow2
  :hypervisor: KVM
  :context:
    :prefixed: true
    :params:
      :ONEAPP_SCAN_ENDPOINT_TARGET_URL: 'opennebula.io'
      :ONEAPP_SCAN_ENDPOINT_RESOLVE_IP: 'NO'
      :ONEAPP_SCAN_VULN_MODULES: 'all'
      :ONEAPP_STORAGE_S3_ENDPOINT: ''
      :ONEAPP_STORAGE_S3_BUCKET: 'tlsa-reports'
      :ONEAPP_STORAGE_S3_ACCESS_KEY: ''
      :ONEAPP_STORAGE_S3_SECRET_KEY: ''
      :ONEAPP_STORAGE_S3_REGION: 'us-east-1'
      :ONEAPP_STORAGE_S3_CUSTOM_HOST_IP: ''
      :ONEAPP_COMPLIANCE_CONFIG_ENABLED: 'NO'
      :ONEAPP_COMPLIANCE_CONFIG_COMPAREMANY: 'NO'
      :ONEAPP_COMPLIANCE_CONFIG_GUIDELINES_ONE: 'ACN'
      :ONEAPP_COMPLIANCE_CONFIG_GUIDELINES_MANY: 'ACN,NIST'
      :ONEAPP_COMPLIANCE_CONFIG_GUIDELINES_FILENAME: 'custom_guidelines.json'
      :ONEAPP_COMPLIANCE_CONFIG_GUIDELINES_CUSTOM: ''
      :ONEAPP_COMPLIANCE_EXTRA_SECURITY: 'NO'
      :ONEAPP_COMPLIANCE_EXTRA_OPENSSL_VERSION: 'ignore'
      :ONEAPP_CONTAINER_NAME: 'tlsassistant'
      :ONEAPP_CONTAINER_VOLUMES: '/data:/tlsassistant/results'

:one:
  :template:
    NAME: base
    TEMPLATE:
      ARCH: x86_64
      CONTEXT:
        NETWORK: 'YES'
        TOKEN: 'YES'
        SSH_PUBLIC_KEY: "$USER[SSH_PUBLIC_KEY]"
        SET_HOSTNAME: "$NAME"
        ONEAPP_SCAN_ENDPOINT_TARGET_URL: "$USER[ONEAPP_SCAN_ENDPOINT_TARGET_URL]"
        ONEAPP_SCAN_ENDPOINT_RESOLVE_IP: "$USER[ONEAPP_SCAN_ENDPOINT_RESOLVE_IP]"
        ONEAPP_SCAN_VULN_MODULES: "$USER[ONEAPP_SCAN_VULN_MODULES]"
        ONEAPP_STORAGE_S3_ENDPOINT: "$USER[ONEAPP_STORAGE_S3_ENDPOINT]"
        ONEAPP_STORAGE_S3_BUCKET: "$USER[ONEAPP_STORAGE_S3_BUCKET]"
        ONEAPP_STORAGE_S3_ACCESS_KEY: "$USER[ONEAPP_STORAGE_S3_ACCESS_KEY]"
        ONEAPP_STORAGE_S3_SECRET_KEY: "$USER[ONEAPP_STORAGE_S3_SECRET_KEY]"
        ONEAPP_STORAGE_S3_REGION: "$USER[ONEAPP_STORAGE_S3_REGION]"
        ONEAPP_STORAGE_S3_CUSTOM_HOST_IP: "$USER[ONEAPP_STORAGE_S3_CUSTOM_HOST_IP]"
        ONEAPP_COMPLIANCE_CONFIG_ENABLED: "$USER[ONEAPP_COMPLIANCE_CONFIG_ENABLED]"
        ONEAPP_COMPLIANCE_CONFIG_COMPAREMANY: "$USER[ONEAPP_COMPLIANCE_CONFIG_COMPAREMANY]"
        ONEAPP_COMPLIANCE_CONFIG_GUIDELINES_ONE: "$USER[ONEAPP_COMPLIANCE_CONFIG_GUIDELINES_ONE]"
        ONEAPP_COMPLIANCE_CONFIG_GUIDELINES_MANY: "$USER[ONEAPP_COMPLIANCE_CONFIG_GUIDELINES_MANY]"
        ONEAPP_COMPLIANCE_CONFIG_GUIDELINES_FILENAME: "$USER[ONEAPP_COMPLIANCE_CONFIG_GUIDELINES_FILENAME]"
        ONEAPP_COMPLIANCE_CONFIG_GUIDELINES_CUSTOM: "$USER[ONEAPP_COMPLIANCE_CONFIG_GUIDELINES_CUSTOM]"
        ONEAPP_COMPLIANCE_EXTRA_SECURITY: "$USER[ONEAPP_COMPLIANCE_EXTRA_SECURITY]"
        ONEAPP_COMPLIANCE_EXTRA_OPENSSL_VERSION: "$USER[ONEAPP_COMPLIANCE_EXTRA_OPENSSL_VERSION]"
      CPU: '4'
      CPU_MODEL:
        MODEL: host-passthrough
      MEMORY: '4096'
      NIC:
        NETWORK: service
      NIC_DEFAULT:
        MODEL: virtio
      OS:
        ARCH: x86_64
  :datastore_name: default
  :timeout: '600'

:infra:
  :disk_format: qcow2
  :apps_path: /var/tmp
